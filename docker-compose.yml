services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    container_name: learnhub_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=learnhub
      - DB_USERNAME=learnhub_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCOUT_DRIVER=meilisearch
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=masterKey123
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnhub_net

  nginx:
    image: nginx:alpine
    container_name: learnhub_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - learnhub_net

  postgres:
    image: postgres:16-alpine
    container_name: learnhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnhub
      POSTGRES_USER: learnhub_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub_user -d learnhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learnhub_net

  redis:
    image: redis:7-alpine
    container_name: learnhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learnhub_net

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: learnhub_meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - learnhub_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: learnhub_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - learnhub_net

  minio:
    image: minio/minio:latest
    container_name: learnhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - learnhub_net

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:

networks:
  learnhub_net:
    driver: bridge
